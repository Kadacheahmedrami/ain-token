[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

# Pin the theme so the dashboard looks the same on any machine.
[theme]
base = "dark"
primaryColor = "#BDFADE"
backgroundColor = "#0B2121"
secondaryBackgroundColor = "#102E2E"
textColor = "#F2F7F5"
font = "sans-serif"
